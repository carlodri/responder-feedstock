schema_version: 1

context:
  version: 2.0.7

package:
  name: responder
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/responder/responder-${{ version }}.tar.gz
  sha256: 23a8f4b0136f74c272d187eb888a16e0b3fe4434881abfb60efecb71d78f6934
  patches:
    - patch_starlette_middleware_exceptions_import.patch

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - responder = responder.cli:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<4.0.0
    - aiofiles
    - apispec >=1.0.0b1
    - apistar
    - chardet
    - docopt
    - graphene <3.0
    - graphql-server-core >=1.2,<2
    - marshmallow
    - python-multipart
    - requests
    - requests-toolbelt
    - rfc3986
    - starlette
    - uvicorn
    - whitenoise

tests:
  - python:
      imports:
        - responder
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - responder --help

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: A familiar HTTP Service Framework for Python
  homepage: https://github.com/taoufik07/responder
  documentation: http://python-responder.org/

extra:
  recipe-maintainers:
    - dhirschfeld
    - carlodri
